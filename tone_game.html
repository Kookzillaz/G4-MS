<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pinyin Tone Drag & Drop</title>
<style>
  * { box-sizing: border-box; touch-action: manipulation; }
  body {
    margin: 0; padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: #f0f9ff;
    color: #1e293b;
    display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  }

  .game-card {
    background: white; border-radius: 20px; padding: 24px;
    width: 100%; max-width: 440px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    display: flex; flex-direction: column; align-items: center; position: relative;
  }

  .lang-switch { position: absolute; top: 16px; right: 16px; }
  .lang-btn {
    background: #e2e8f0; border: none; padding: 4px 10px;
    border-radius: 6px; font-weight: bold; cursor: pointer;
  }
  .lang-btn.active { background: #0284c7; color: white; }

  .progress-bar {
    width: 100%; height: 8px; background: #e2e8f0;
    border-radius: 4px; margin-top: 24px; margin-bottom: 20px; overflow: hidden;
  }
  .progress-fill { height: 100%; background: #0284c7; width: 0%; transition: width 0.3s ease; }

  .zh-display { font-size: 44px; font-weight: bold; color: #0369a1; margin-bottom: 4px; text-align: center; }
  .meaning-display { font-size: 16px; color: #64748b; margin-bottom: 24px; text-align: center; }

  .pinyin-container { display: flex; gap: 8px; margin-bottom: 28px; flex-wrap: wrap; justify-content: center; }
  .pinyin-char-box { display: flex; flex-direction: column; align-items: center; font-size: 24px; font-weight: bold; margin: 0 2px; }
  .tone-slot {
    width: 36px; height: 36px; border: 2px dashed #94a3b8;
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: #0284c7; background: #f8fafc; margin-bottom: 4px; cursor: pointer;
  }
  .tone-slot.filled { border-style: solid; border-color: #0284c7; background: #e0f2fe; }

  .tone-palette-title { font-size: 14px; color: #64748b; margin-bottom: 12px; text-align: center; }
  .tone-palette { display: flex; gap: 12px; margin-bottom: 24px; }
  .tone-btn {
    width: 52px; height: 52px; border-radius: 12px;
    background: #0284c7; color: white; font-size: 26px; font-weight: bold;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: 0 4px 6px rgba(2, 132, 199, 0.2); user-select: none;
  }
  .tone-btn.selected { background: #f59e0b; }

  .action-btn {
    width: 100%; padding: 14px; border-radius: 12px; border: none;
    background: #10b981; color: white; font-size: 18px; font-weight: bold; cursor: pointer;
  }
  .feedback-text { margin-top: 16px; font-weight: bold; font-size: 15px; min-height: 24px; text-align: center; }
  .feedback-text.correct { color: #10b981; }
  .feedback-text.wrong { color: #ef4444; }
</style>
</head>
<body>

<div class="game-card">
  <div class="lang-switch">
    <button class="lang-btn active" id="btn-en" onclick="setLanguage('en')">EN</button>
    <button class="lang-btn" id="btn-th" onclick="setLanguage('th')">TH</button>
  </div>

  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

  <div class="zh-display" id="zh-display"></div>
  <div class="meaning-display" id="meaning-display"></div>

  <div class="pinyin-container" id="pinyin-container"></div>

  <div class="tone-palette-title" id="palette-title">Tap tone mark, then tap slot above vowel:</div>
  <div class="tone-palette">
    <div class="tone-btn" onclick="selectTone('ˉ', this)">ˉ</div>
    <div class="tone-btn" onclick="selectTone('ˊ', this)">ˊ</div>
    <div class="tone-btn" onclick="selectTone('ˇ', this)">ˇ</div>
    <div class="tone-btn" onclick="selectTone('ˋ', this)">ˋ</div>
  </div>

  <button class="action-btn" id="action-btn" onclick="checkAnswer()">Check Answer</button>
  <div class="feedback-text" id="feedback"></div>
</div>

<script>
let currentLang = 'en';

const i18n = {
  en: {
    paletteTitle: "Tap tone mark, then tap slot above vowel (tap again to clear):",
    checkBtn: "Check Answer", nextBtn: "Next ➔", restartBtn: "Play Again",
    correctMsg: (py) => `✨ Correct! (Pinyin: ${py})`,
    wrongMsg: "❌ Incorrect! Check the tone marks again.",
    doneTitle: "🎉 All Done!", doneDesc: "Great job practicing all 9 vocabulary words!"
  },
  th: {
    paletteTitle: "แตะเลือกวรรณยุกต์ แล้วแตะช่องสระ (แตะซ้ำเพื่อลบออก):",
    checkBtn: "ตรวจคำตอบ", nextBtn: "ข้อถัดไป ➔", restartBtn: "เริ่มเล่นใหม่อีกครั้ง",
    correctMsg: (py) => `✨ ถูกต้อง! (Pinyin: ${py})`,
    wrongMsg: "❌ ยังไม่ถูกต้อง ลองเช็กวรรณยุกต์อีกครั้งครับ!",
    doneTitle: "🎉 สำเร็จแล้ว!", doneDesc: "ยินดีด้วย! ซ้อมจำวรรณยุกต์ครบทั้ง 9 คำแล้ว!"
  }
};

const vocabData = [
  { zh: "跑步", en: "Jogging", th: "วิ่งจ็อกกิ้ง", fullPy: "pǎobù", chars: [{ text: "p a o", tone: "ˇ" }, { text: "b u", tone: "ˋ" }] },
  { zh: "打电话", en: "Make a phone call", th: "โทรศัพท์", fullPy: "dǎ diànhuà", chars: [{ text: "d a", tone: "ˇ" }, { text: "d i a n", tone: "ˋ" }, { text: "h u a", tone: "ˋ" }] },
  { zh: "上网", en: "Surf the internet", th: "เล่นอินเทอร์เน็ต", fullPy: "shàngwǎng", chars: [{ text: "s h a n g", tone: "ˋ" }, { text: "w a n g", tone: "ˇ" }] },
  { zh: "玩游戏", en: "Play games", th: "เล่นเกม", fullPy: "wán yóuxì", chars: [{ text: "w a n", tone: "ˊ" }, { text: "y o u", tone: "ˊ" }, { text: "x i", tone: "ˋ" }] },
  { zh: "写作业", en: "Do homework", th: "ทำการบ้าน", fullPy: "xiě zuòyè", chars: [{ text: "x i e", tone: "ˇ" }, { text: "z u o", tone: "ˋ" }, { text: "y e", tone: "ˋ" }] },
  { zh: "洗衣服", en: "Do laundry", th: "ซักผ้า", fullPy: "xǐ yīfu", chars: [{ text: "x i", tone: "ˇ" }, { text: "y i", tone: "ˉ" }, { text: "f u", tone: "" }] },
  { zh: "学习", en: "Study", th: "เรียน", fullPy: "xuéxí", chars: [{ text: "x u e", tone: "ˊ" }, { text: "x i", tone: "ˊ" }] },
  { zh: "看电视", en: "Watch TV", th: "ดูโทรทัศน์", fullPy: "kàn diànshì", chars: [{ text: "k a n", tone: "ˋ" }, { text: "d i a n", tone: "ˋ" }, { text: "s h i", tone: "ˋ" }] },
  { zh: "扫地", en: "Sweep the floor", th: "กวาดบ้าน", fullPy: "sǎodì", chars: [{ text: "s a o", tone: "ˇ" }, { text: "d i", tone: "ˋ" }] }
];

let currentIndex = 0, selectedToneMark = null, userTones = [];

function setLanguage(lang) {
  currentLang = lang;
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-th').classList.toggle('active', lang === 'th');
  document.getElementById('palette-title').innerText = i18n[lang].paletteTitle;
  loadQuestion();
}

function loadQuestion() {
  if (currentIndex >= vocabData.length) return;
  const q = vocabData[currentIndex];
  document.getElementById('zh-display').innerText = q.zh;
  document.getElementById('meaning-display').innerText = q[currentLang];
  document.getElementById('feedback').innerText = '';
  document.getElementById('action-btn').innerText = i18n[currentLang].checkBtn;
  document.getElementById('action-btn').onclick = checkAnswer;
  
  document.getElementById('progress').style.width = (currentIndex / vocabData.length * 100) + '%';

  const container = document.getElementById('pinyin-container');
  container.innerHTML = '';
  userTones = new Array(q.chars.length).fill('');

  q.chars.forEach((c, charIdx) => {
    const box = document.createElement('div');
    box.className = 'pinyin-char-box';
    const slot = document.createElement('div');
    slot.className = 'tone-slot';
    slot.onclick = () => applyToneToSlot(slot, charIdx);
    const label = document.createElement('div');
    label.innerText = c.text;
    box.appendChild(slot);
    box.appendChild(label);
    container.appendChild(box);
  });
}

function selectTone(tone, btn) {
  if (selectedToneMark === tone) {
    selectedToneMark = null;
    btn.classList.remove('selected');
  } else {
    selectedToneMark = tone;
    document.querySelectorAll('.tone-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
  }
}

function applyToneToSlot(slot, idx) {
  // If the same tone is tapped again on the slot, or no tone selected, clear it
  if (slot.innerText === selectedToneMark || !selectedToneMark) {
    slot.innerText = '';
    slot.classList.remove('filled');
    userTones[idx] = '';
  } else {
    slot.innerText = selectedToneMark;
    slot.classList.add('filled');
    userTones[idx] = selectedToneMark;
  }
}

function checkAnswer() {
  const q = vocabData[currentIndex];
  let isCorrect = q.chars.every((c, idx) => c.tone === userTones[idx]);
  const feedback = document.getElementById('feedback');

  if (isCorrect) {
    feedback.className = 'feedback-text correct';
    feedback.innerText = i18n[currentLang].correctMsg(q.fullPy);
    document.getElementById('action-btn').innerText = i18n[currentLang].nextBtn;
    document.getElementById('action-btn').onclick = nextQuestion;
  } else {
    feedback.className = 'feedback-text wrong';
    feedback.innerText = i18n[currentLang].wrongMsg;
  }
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex >= vocabData.length) {
    document.getElementById('zh-display').innerText = '🎉';
    document.getElementById('meaning-display').innerText = i18n[currentLang].doneDesc;
    document.getElementById('pinyin-container').innerHTML = '';
    document.getElementById('feedback').innerText = '';
    document.getElementById('action-btn').innerText = i18n[currentLang].restartBtn;
    document.getElementById('action-btn').onclick = () => { currentIndex = 0; loadQuestion(); };
  } else loadQuestion();
}

setLanguage('en');
</script>
</body>
</html>
