<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pinyin Bubble Pop</title>
<style>
  * { box-sizing: border-box; touch-action: manipulation; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #1e1b4b 0%, #312e81 100%);
    color: white;
    overflow: hidden;
  }

  /* Main Wrapper */
  .main-wrapper {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh; /* Dynamic viewport height for iPad / Mobile browsers */
    position: relative;
  }
  
  /* Top Bar */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(5px);
    z-index: 10;
    flex-shrink: 0;
  }
  .score-box, .lives-box { font-size: 20px; font-weight: bold; }
  .lives-box { color: #ef4444; }

  /* Game Area */
  .game-area {
    flex: 1;
    position: relative;
    overflow: hidden;
    width: 100%;
  }

  /* Falling Target */
  .falling-target {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 255, 255, 0.15);
    border: 2px solid #a855f7;
    backdrop-filter: blur(8px);
    padding: 16px 32px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(168, 85, 247, 0.3);
    z-index: 5;
    pointer-events: none;
  }
  .target-zh { font-size: 42px; font-weight: bold; color: #fef08a; line-height: 1.2; }
  .target-meaning { font-size: 18px; color: #e9d5ff; margin-top: 4px; }

  /* Bottom Bubble Zone */
  .bubble-zone {
    height: 120px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 0 20px 20px 20px;
    z-index: 10;
  }
  .bubble {
    width: 90px; height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #38bdf8, #0284c7);
    box-shadow: 0 6px 16px rgba(56, 189, 248, 0.4), inset 0 2px 4px rgba(255,255,255,0.6);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: bold; color: white;
    cursor: pointer; user-select: none;
    transition: transform 0.1s;
  }
  .bubble:active { transform: scale(0.92); }

  /* Overlay Screens */
  .overlay {
    position: absolute; inset: 0;
    background: rgba(15, 23, 42, 0.92);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 20; padding: 20px; text-align: center;
  }
  .overlay h1 { color: #fef08a; margin-bottom: 12px; font-size: 32px; }
  .btn {
    background: #8b5cf6; color: white; border: none;
    padding: 16px 36px; font-size: 20px; font-weight: bold;
    border-radius: 14px; cursor: pointer; margin-top: 20px;
    box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4);
  }
  .btn:active { background: #7c3aed; }
  
  .speed-select { margin-top: 20px; display: flex; gap: 12px; }
  .speed-btn {
    background: #334155; color: white; border: 2px solid #475569;
    padding: 10px 20px; border-radius: 10px; cursor: pointer; font-size: 16px;
  }
  .speed-btn.active { border-color: #38bdf8; background: #0284c7; }
  
  .lang-switch { position: absolute; top: 16px; right: 20px; z-index: 30; }
  .lang-btn {
    background: rgba(255,255,255,0.2); color: white;
    border: none; padding: 6px 14px; border-radius: 8px; font-weight: bold; font-size: 16px;
    cursor: pointer;
  }
  .lang-btn.active { background: #8b5cf6; }
</style>
</head>
<body>

<div class="main-wrapper">
  <div class="top-bar">
    <div class="score-box"><span id="lbl-score">Score</span>: <span id="score">0</span></div>
    <div class="lives-box" id="lives">❤️❤️❤️</div>
  </div>

  <div class="game-area" id="game-area">
    <div class="falling-target" id="target" style="display: none;">
      <div class="target-zh" id="target-zh">警察</div>
      <div class="target-meaning" id="target-meaning">Police</div>
    </div>
  </div>

  <div class="bubble-zone" id="bubble-container"></div>

  <!-- Start Overlay -->
  <div class="overlay" id="start-screen">
    <div class="lang-switch">
      <button class="lang-btn active" id="btn-en" onclick="setLanguage('en')">EN</button>
      <button class="lang-btn" id="btn-th" onclick="setLanguage('th')">TH</button>
    </div>
    <h1>🎈 Pinyin Bubble Pop</h1>
    <p id="start-desc" style="font-size: 18px; max-width: 400px; color: #cbd5e1;">Tap the correct Pinyin bubble before the word hits the ground!</p>
    
    <div class="speed-select">
      <button class="speed-btn active" id="spd-slow" onclick="setSpeed(1, this)">Slow</button>
      <button class="speed-btn" id="spd-norm" onclick="setSpeed(1.5, this)">Normal</button>
      <button class="speed-btn" id="spd-fast" onclick="setSpeed(2.2, this)">Fast</button>
    </div>

    <button class="btn" id="start-btn" onclick="startGame()">Start Game</button>
  </div>

  <!-- Game Over Overlay -->
  <div class="overlay" id="gameover-screen" style="display: none;">
    <h1 id="go-title">💥 Game Over!</h1>
    <p id="final-score" style="font-size: 24px; margin-bottom: 10px; color: #e2e8f0;"></p>
    <button class="btn" id="restart-btn" onclick="startGame()">Play Again</button>
  </div>
</div>

<script>
let currentLang = 'en';

const i18n = {
  en: {
    score: "Score",
    startDesc: "Tap the correct Pinyin bubble before the word hits the ground!",
    slow: "Slow", norm: "Normal", fast: "Fast",
    start: "Start Game", goTitle: "💥 Game Over!", replay: "Play Again",
    finalScore: (s) => `Your Score: ${s}`
  },
  th: {
    score: "คะแนน",
    startDesc: "แตะลูกโป่ง Pinyin ที่ถูกต้องก่อนตัวอักษรตกถึงพื้น!",
    slow: "ช้า", norm: "ปกติ", fast: "เร็ว",
    start: "เริ่มเล่นเลย!", goTitle: "💥 จบเกม!", replay: "เล่นอีกครั้ง",
    finalScore: (s) => `คุณทำได้ ${s} คะแนน!`
  }
};

const vocabList = [
  { zh: "警察", py: "jǐngchá", en: "Police", th: "ตำรวจ" },
  { zh: "厨师", py: "chúshī", en: "Chef", th: "พ่อครัว" },
  { zh: "司机", py: "sījī", en: "Driver", th: "คนขับรถ" },
  { zh: "医生", py: "yīshēng", en: "Doctor", th: "หมอ" },
  { zh: "护士", py: "hùshi", en: "Nurse", th: "พยาบาล" },
  { zh: "职员", py: "zhíyuán", en: "Office Worker", th: "พนักงานบริษัท" },
  { zh: "公务员", py: "gōngwùyuán", en: "Government Officer", th: "ข้าราชการ" },
  { zh: "全职妈妈", py: "quánzhí māma", en: "Housekeeper", th: "แม่บ้าน" }
];

let score = 0, lives = 3, speedFactor = 1, currentWord = null, animId = null, targetPos = 0;

function setLanguage(lang) {
  currentLang = lang;
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-th').classList.toggle('active', lang === 'th');
  
  document.getElementById('lbl-score').innerText = i18n[lang].score;
  document.getElementById('start-desc').innerText = i18n[lang].startDesc;
  document.getElementById('spd-slow').innerText = i18n[lang].slow;
  document.getElementById('spd-norm').innerText = i18n[lang].norm;
  document.getElementById('spd-fast').innerText = i18n[lang].fast;
  document.getElementById('start-btn').innerText = i18n[lang].start;
  document.getElementById('go-title').innerText = i18n[lang].goTitle;
  document.getElementById('restart-btn').innerText = i18n[lang].replay;
}

function setSpeed(speed, btn) {
  speedFactor = speed;
  document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function startGame() {
  score = 0; lives = 3;
  document.getElementById('score').innerText = score;
  updateLivesDisplay();
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('gameover-screen').style.display = 'none';
  nextTurn();
}

function updateLivesDisplay() { document.getElementById('lives').innerText = '❤️'.repeat(lives); }
function shuffle(array) { return array.sort(() => Math.random() - 0.5); }

function nextTurn() {
  cancelAnimationFrame(animId);
  currentWord = vocabList[Math.floor(Math.random() * vocabList.length)];
  
  const targetEl = document.getElementById('target');
  document.getElementById('target-zh').innerText = currentWord.zh;
  document.getElementById('target-meaning').innerText = currentWord[currentLang];
  targetEl.style.display = 'block';
  targetPos = 0;
  targetEl.style.top = '0px';

  const wrongOptions = vocabList.filter(v => v.py !== currentWord.py);
  const options = shuffle([currentWord, ...shuffle(wrongOptions).slice(0, 2)]);

  const container = document.getElementById('bubble-container');
  container.innerHTML = '';
  options.forEach(opt => {
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerText = opt.py;
    bubble.onclick = () => checkAnswer(opt.py);
    container.appendChild(bubble);
  });

  // Dynamically calculate bottom threshold based on container height
  const gameArea = document.getElementById('game-area');
  const maxDropHeight = gameArea.clientHeight - targetEl.offsetHeight - 10;
  
  function drop() {
    targetPos += (1.0 * speedFactor);
    targetEl.style.top = targetPos + 'px';
    
    if (targetPos >= maxDropHeight) {
      handleMiss();
    } else {
      animId = requestAnimationFrame(drop);
    }
  }
  animId = requestAnimationFrame(drop);
}

function checkAnswer(selectedPy) {
  if (selectedPy === currentWord.py) {
    score += 10;
    document.getElementById('score').innerText = score;
    nextTurn();
  } else handleMiss();
}

function handleMiss() {
  lives--;
  updateLivesDisplay();
  if (lives <= 0) {
    cancelAnimationFrame(animId);
    document.getElementById('target').style.display = 'none';
    document.getElementById('final-score').innerText = i18n[currentLang].finalScore(score);
    document.getElementById('gameover-screen').style.display = 'flex';
  } else nextTurn();
}

setLanguage('en');
</script>
</body>
</html>
